<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071626"><title>Nuestra carta · La Causa &amp; Sabor</title><link rel="stylesheet" href="styles.css?v=8"><script src="menu-data.js"></script></head><body><main id="app">
<section id="categories-screen" class="category-screen"><header class="topbar"><button onclick="location.href='index.html'">‹ &nbsp; Inicio</button><div class="title"><strong>Nuestra Carta</strong><small>Seleccione una categoría</small></div><span style="width:64px"></span></header><div class="search-wrap"><div class="searchbox"><input id="search" type="search" placeholder="Buscar ceviche, causa, dúo, chilcano..." aria-label="Buscar platos"></div></div><div id="categories" class="category-list"></div><div id="search-results" class="search-results" hidden></div><div class="footer-note">La Causa &amp; Sabor · Sabores peruanos</div></section>
<section id="dishes-screen" class="dish-screen" hidden><header class="topbar"><button id="back-categories">‹ &nbsp; Categorías</button><div class="title"><strong id="category-title"></strong><small id="category-count"></small></div><span style="width:90px"></span></header><div class="hero-banner"><img id="category-image" alt=""><div class="hero-overlay"><b id="category-badge"></b><p id="category-description"></p></div></div><nav class="filters" aria-label="Filtrar platos"><button class="filter active" data-filter="all">Todos</button><button class="filter" data-filter="favorito">Populares</button><button class="filter" data-filter="fresco">Recomendados</button></nav><div id="dishes" class="dishes"></div></section>
<div id="detail-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detail-title"><article class="modal-card"><div class="modal-image"><img id="detail-image" alt=""><button id="close-detail" class="modal-close" aria-label="Cerrar">×</button></div><div class="modal-body"><span id="detail-tag" class="modal-tag"></span><h2 id="detail-title"></h2><span id="detail-portion" class="portion"></span><p id="detail-description"></p><strong id="detail-price" class="price"></strong><div id="detail-ingredients" class="ingredients"></div></div></article></div>
</main><script>
const byId=id=>document.getElementById(id), keys=Object.keys(MENU_DATA), categoryDescriptions={entradas:'Causas rellenas artesanales, ceviches tradicionales y tiraditos frescos.',duos:'Ceviche fresco al limón con chicharrón crujiente o arroz con mariscos.',fondos:'Arroz con mariscos calientito, pescado a lo macho, jalea real y parihuelas.',cocteles:'Pisco Sour de la casa, chilcanos macerados, chicha morada natural y cervezas.',postres:'Suspiro a la limeña tradicional, mousse de lúcuma y combinado criollo.'};let activeCategory=null,activeFilter='all';
function money(n){return 'S/ '+Number(n).toFixed(2)}
function renderCategories(){byId('categories').innerHTML=keys.map((key,index)=>{const cat=MENU_DATA[key],min=Math.min(...cat.items.map(item=>item.price));return `<button class="category ${index<2?'featured':''}" data-category="${key}"><img class="catpic" src="${cat.heroImg}" alt=""><span class="catcopy"><b>${cat.title}</b><p>${categoryDescriptions[key]||cat.description}</p><span class="meta"><span class="price">Desde ${money(min)}</span><span class="pill">${cat.badge}</span></span></span><span class="arrow">›</span></button>`}).join('');byId('categories').querySelectorAll('[data-category]').forEach(button=>button.addEventListener('click',()=>openCategory(button.dataset.category)))}
function openCategory(key){activeCategory=key;activeFilter='all';const cat=MENU_DATA[key];byId('category-title').textContent=cat.title;byId('category-count').textContent=`${cat.items.length} platos disponibles`;byId('category-image').src=cat.heroImg;byId('category-image').alt=cat.title;byId('category-badge').textContent=cat.badge;byId('category-description').textContent=cat.description;document.querySelectorAll('.filter').forEach(button=>button.classList.toggle('active',button.dataset.filter==='all'));renderDishes();byId('categories-screen').hidden=true;byId('dishes-screen').hidden=false;window.scrollTo(0,0)}
function renderDishes(){const items=MENU_DATA[activeCategory].items.filter(item=>activeFilter==='all'||item.filter===activeFilter);byId('dishes').innerHTML=items.map(item=>`<article class="dish"><img src="${item.img}" alt="${item.title}"><div class="dish-main"><h3>${item.title}</h3><p>${item.desc}</p><div class="dish-bottom"><strong class="price">${money(item.price)}</strong><button class="detail-btn" data-detail="${item.id}">Detalle</button></div></div></article>`).join('')||'<div class="empty">No hay platos con este filtro en esta sección.</div>';byId('dishes').querySelectorAll('[data-detail]').forEach(button=>button.addEventListener('click',()=>showDetail(findDish(button.dataset.detail))))}
function findDish(id){for(const key of keys){const found=MENU_DATA[key].items.find(item=>item.id===id);if(found)return found}return null}
function showDetail(item){if(!item)return;byId('detail-image').src=item.img;byId('detail-image').alt=item.title;byId('detail-tag').textContent=item.tag;byId('detail-title').textContent=item.title;byId('detail-portion').textContent=item.portion;byId('detail-description').textContent=item.desc;byId('detail-price').textContent=money(item.price);byId('detail-ingredients').innerHTML=item.ingredients.map(name=>`<span class="ingredient">• ${name}</span>`).join('');byId('detail-modal').classList.add('show');byId('close-detail').focus()}
function closeDetail(){byId('detail-modal').classList.remove('show')}
byId('back-categories').addEventListener('click',()=>{byId('dishes-screen').hidden=true;byId('categories-screen').hidden=false;window.scrollTo(0,0)});document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{activeFilter=button.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===button));renderDishes()}));byId('close-detail').addEventListener('click',closeDetail);byId('detail-modal').addEventListener('click',event=>{if(event.target===byId('detail-modal'))closeDetail()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDetail()});
byId('search').addEventListener('input',event=>{const query=event.target.value.trim().toLocaleLowerCase('es');const results=byId('search-results'),categories=byId('categories');if(!query){results.hidden=true;categories.hidden=false;return}const matches=keys.flatMap(key=>MENU_DATA[key].items.map(item=>({...item,category:MENU_DATA[key].title}))).filter(item=>item.title.toLocaleLowerCase('es').includes(query)||item.desc.toLocaleLowerCase('es').includes(query)||item.ingredients.some(name=>name.toLocaleLowerCase('es').includes(query)));categories.hidden=true;results.hidden=false;results.innerHTML=matches.length?matches.map(item=>`<article class="result"><img src="${item.img}" alt=""><div class="result-copy"><b>${item.title}</b><span>${money(item.price)} · ${item.category}</span></div><button class="detail-btn" data-search-detail="${item.id}">Detalle</button></article>`).join(''):'<div class="empty">No encontramos platos con esa búsqueda.</div>';results.querySelectorAll('[data-search-detail]').forEach(button=>button.addEventListener('click',()=>showDetail(findDish(button.dataset.searchDetail))))});renderCategories();
</script></body></html>
